<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.profile }}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body
  class="app-shell mobile-client-shell"
  data-dev-auth-bypass="{{ 'true' if dev_auth_bypass else 'false' }}"
  data-dev-auth-mock-username="{{ dev_auth_mock_username }}"
  data-lang="{{ lang }}"
  data-email-skip-verification="{{ 'true' if email_skip_verification else 'false' }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client?lang={{ lang }}">{{ brand_name }}</a>
      {% include "partials/client_user_chip.html" %}
    </div>
  </header>

  <main class="mobile-client">
    <section class="card compact-card">
      <h2>{{ t.profile }}</h2>
      <div class="muted"><span id="auth-provider">{{ initial_auth_provider }}</span></div>
      <button type="button" id="profile-logout-btn" class="secondary-btn profile-logout-btn" hidden>{{ t.logout or 'Выйти' }}</button>
    </section>

    <section class="card" id="email-password-reset-panel" hidden>
      <h2>{{ t.password_reset }}</h2>
      <form id="email-password-reset-form" class="form-grid">
        <button type="button" id="password-reset-request-btn" class="secondary-btn">{{ t.send_code }}</button>
        <label>{{ t.verification_code }} <input id="password-reset-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" /></label>
        <label>{{ t.password }} <input id="password-reset-new" type="password" autocomplete="new-password" minlength="8" /></label>
        <label>{{ t.repeat_password }} <input id="password-reset-confirm" type="password" autocomplete="new-password" minlength="8" /></label>
        <button type="submit" class="primary-btn">{{ t.password_reset }}</button>
      </form>
      <pre id="password-reset-result" class="result"></pre>
    </section>

    <section class="card">
      <h2>{{ t.request_history }}</h2>
      <div id="request-history" class="history-list"></div>
      <pre id="history-result" class="result"></pre>
    </section>

  </main>

  <script defer src="/static/app.js?v=57ae02d-hidden-v1"></script>
</body>
</html>
