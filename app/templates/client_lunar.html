{% extends "layouts/client_base.html" %}

{% block title %}{{ brand_name }} - {{ t.lunar_calendar }}{% endblock %}

{% block content %}
  {% with hero_title=t.lunar_calendar %}
  {% include "partials/client_page_hero.html" %}
  {% endwith %}

  <section class="card service-theme-shell">
    <div class="auth-required-content">
      <form id="lunar-form" class="form-grid service-theme-form">
        <label>{{ t.year }} <input id="lunar-year" type="number" min="1970" max="2100" /></label>
        <label>{{ t.month }} <input id="lunar-month" type="number" min="1" max="12" /></label>
        <button type="submit" class="primary-btn">{{ t.load }}</button>
      </form>
      <div id="lunar-calendar" class="lunar-grid"></div>
      <div id="lunar-result" class="result" aria-live="polite" hidden></div>
    </div>
  </section>
{% endblock %}
