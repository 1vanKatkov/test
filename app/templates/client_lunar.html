<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.lunar_calendar }}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body
  class="app-shell mobile-client-shell"
  data-dev-auth-bypass="{{ 'true' if dev_auth_bypass else 'false' }}"
  data-dev-auth-mock-username="{{ dev_auth_mock_username }}"
  data-lang="{{ lang }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client?lang={{ lang }}">{{ brand_name }}</a>
      <div class="user-chip">
        <a class="auth-username-link" href="/client/profile?lang={{ lang }}"><span id="auth-username">{{ initial_auth_username }}</span></a>
        <span class="spark-pill"><span id="header-sparks">-</span> {{ t.sparks }}</span>
      </div>
    </div>
  </header>

  <main class="mobile-client">
    <section class="card compact-card">
      <h2>{{ t.lunar_calendar }}</h2>
      <div class="muted"><span id="auth-provider">{{ initial_auth_provider }}</span></div>
    </section>

    <section class="card">
      <form id="lunar-form" class="form-grid">
        <label>{{ t.year }} <input id="lunar-year" type="number" min="1970" max="2100" /></label>
        <label>{{ t.month }} <input id="lunar-month" type="number" min="1" max="12" /></label>
        <button type="submit" class="primary-btn">{{ t.load }}</button>
      </form>
      <div id="lunar-calendar" class="lunar-grid"></div>
      <pre id="lunar-result" class="result"></pre>
    </section>

  </main>

  {% include "partials/email_auth_panel.html" %}

  <script defer src="/static/app.js?v=6400703"></script>
</body>
</html>
