<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.cabinet }}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body
  class="app-shell mobile-client-shell"
  data-dev-auth-bypass="{{ 'true' if dev_auth_bypass else 'false' }}"
  data-dev-auth-mock-username="{{ dev_auth_mock_username }}"
  data-lang="{{ lang }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client?lang={{ lang }}">{{ brand_name }}</a>
      {% include "partials/client_user_chip.html" %}
    </div>
  </header>

  <main class="mobile-client">
    <section class="card compact-card">
      <p id="telegram-auth-status" class="result muted" hidden></p>
      <div class="compact-actions">
        <a class="secondary-btn compact-action-btn" href="/client/support?lang={{ lang }}">{{ t.support }}</a>
        <a class="secondary-btn compact-action-btn" href="/client/topup?lang={{ lang }}">{{ t.topup }}</a>
      </div>
    </section>

    <section id="admin-panel-entry" class="card" hidden>
      <a id="admin-panel-button" class="secondary-btn compact-action-btn" href="/admin?lang={{ lang }}">{{ t.admin_panel }}</a>
    </section>

    <section class="icon-grid">
      <a class="feature-icon-tile" href="/client/sonnik?lang={{ lang }}">
        <span class="tile-emoji">🌙</span>
        <span class="tile-title">{{ t.sonnik }}</span>
      </a>
      <a class="feature-icon-tile" href="/client/numerology?lang={{ lang }}">
        <span class="tile-emoji">🔢</span>
        <span class="tile-title">{{ t.numerology }}</span>
      </a>
      <a class="feature-icon-tile" href="/client/compatibility?lang={{ lang }}">
        <span class="tile-emoji">💞</span>
        <span class="tile-title">{{ t.compatibility }}</span>
      </a>
      <span class="feature-icon-tile feature-icon-tile-disabled" aria-disabled="true">
        <span class="tile-emoji">🗓️</span>
        <span class="tile-title">{{ t.lunar_calendar }}</span>
        <span class="tile-soon">{{ t.soon }}</span>
      </span>
    </section>

  </main>

  <script defer src="/static/app.js?v=f3aa0cd-auth1"></script>
</body>
</html>
