<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.login }}</title>
  <link rel="stylesheet" href="/static/style.css?v=outer-blocks-v1" />
</head>
<body
  class="app-shell mobile-client-shell auth-page"
  data-page="login"
  data-api-base=""
  data-lang="{{ lang }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client?lang={{ lang }}">{{ brand_name }}</a>
      {% include "partials/client_user_chip.html" %}
    </div>
  </header>

  <main class="mobile-client">
    <section class="card">
      <h2>{{ t.login }}</h2>
      <form id="email-login-form" class="form-grid" method="post" action="#">
        <label>{{ t.email }} <input id="login-email" type="email" autocomplete="email" required /></label>
        <label>{{ t.password }} <input id="login-password" type="password" autocomplete="current-password" required minlength="8" /></label>
        <button type="submit" class="primary-btn">{{ t.login }}</button>
      </form>
      <p class="muted auth-switch-line">
        {{ t.no_account }}
        <a href="/static/auth/register.html?lang={{ lang }}">{{ t.go_to_register }}</a>
      </p>
      <pre id="auth-result" class="result"></pre>
    </section>
  </main>

  <script defer src="/static/app.js?v=divination-v1"></script>
</body>
</html>
