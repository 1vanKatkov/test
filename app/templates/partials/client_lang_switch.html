<nav class="lang-switch" aria-label="{{ t.language_switch_label }}">
  <a
    href="#"
    class="lang-switch-item{% if lang == 'ru' %} is-active{% endif %}"
    data-lang="ru"
    hreflang="ru"
    lang="ru"
  >RU</a>
  <a
    href="#"
    class="lang-switch-item{% if lang == 'en' %} is-active{% endif %}"
    data-lang="en"
    hreflang="en"
    lang="en"
  >EN</a>
</nav>
