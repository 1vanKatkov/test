<section class="card" id="email-auth-entry" hidden>
  <h2>{{ t.email_auth }}</h2>
  <p class="muted">{{ t.auth_cell_open }}</p>
  <button id="open-email-auth-modal" class="primary-btn" type="button">{{ t.auth_cell_open }}</button>
</section>

<div id="email-auth-modal" class="modal-overlay">
  <section class="modal-card auth-modal-card">
    <div class="payment-row-top">
      <h3>{{ t.email_auth }}</h3>
      <button id="close-email-auth-modal" class="ghost-btn" type="button" aria-label="{{ t.close }}">×</button>
    </div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab is-active" data-auth-tab="register">{{ t.register }}</button>
      <button type="button" class="auth-tab" data-auth-tab="login">{{ t.login }}</button>
    </div>
    <form id="email-register-form" class="form-grid auth-panel" data-auth-panel="register">
      <label>{{ t.email }} <input id="register-email" type="email" autocomplete="email" required /></label>
      <label>{{ t.password }} <input id="register-password" type="password" autocomplete="new-password" required minlength="8" /></label>
      <label>{{ t.repeat_password }} <input id="register-password-confirm" type="password" autocomplete="new-password" required minlength="8" /></label>
      <button type="submit" class="primary-btn">{{ t.send_code }}</button>
    </form>
    <form id="email-register-verify-form" class="form-grid auth-panel" data-auth-panel="register-verify" hidden>
      <p class="muted">{{ t.code_sent }}</p>
      <label>{{ t.verification_code }} <input id="register-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required /></label>
      <button type="submit" class="primary-btn">{{ t.confirm_registration }}</button>
      <button type="button" id="register-back-btn" class="ghost-btn">{{ t.back }}</button>
    </form>
    <form id="email-login-form" class="form-grid auth-panel" data-auth-panel="login" hidden>
      <label>{{ t.email }} <input id="login-email" type="email" autocomplete="email" required /></label>
      <label>{{ t.password }} <input id="login-password" type="password" autocomplete="current-password" required minlength="8" /></label>
      <button type="submit" class="primary-btn">{{ t.login }}</button>
    </form>
    <pre id="auth-result" class="result"></pre>
  </section>
</div>
