<div class="user-chip">
  <a class="auth-username-link" href="/client/profile?lang={{ lang }}"><span id="auth-username">{{ initial_auth_username }}</span></a>
  <span id="header-auth-links" class="header-auth-links">
    <a class="header-auth-btn" href="/client/login?lang={{ lang }}">{{ t.login }}</a>
    <a class="header-auth-btn header-auth-btn-primary" href="/client/register?lang={{ lang }}">{{ t.register }}</a>
  </span>
  <span class="spark-pill"><span id="header-sparks">-</span> {{ t.sparks }}</span>
</div>
