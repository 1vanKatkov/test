<div class="topbar-actions">
  {% include "partials/client_lang_switch.html" %}
  <div class="user-chip">
    <a class="auth-username-link" href="/client/profile">
      <span id="auth-username">{{ initial_auth_username }}</span>
      <span id="header-plus-badge" class="plus-badge" hidden>{{ t.plus_badge or "Plus" }}</span>
    </a>
    <span id="header-auth-links" class="header-auth-links">
      <a class="header-auth-btn" href="/static/auth/login.html">{{ t.login }}</a>
      <a class="header-auth-btn header-auth-btn-primary" href="/static/auth/register.html">{{ t.register }}</a>
    </span>
    <span id="header-spark-pill" class="spark-pill" hidden><span id="header-sparks">-</span> <span class="spark-icon" aria-hidden="true">✦</span></span>
  </div>
</div>
