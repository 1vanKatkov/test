<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.admin_panel }}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body
  class="app-shell mobile-client-shell"
  data-dev-auth-bypass="{{ 'true' if dev_auth_bypass else 'false' }}"
  data-dev-auth-mock-username="{{ dev_auth_mock_username }}"
  data-lang="{{ lang }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client?lang={{ lang }}">{{ brand_name }}</a>
      {% include "partials/client_user_chip.html" %}
    </div>
  </header>

  <main class="mobile-client">
    <section class="card compact-card">
      <h2>{{ t.admin_panel }}</h2>
      <div class="muted"><span id="auth-provider">{{ initial_auth_provider }}</span></div>
    </section>

    <section class="card">
      <h2>{{ t.admin_users }}</h2>
      <form id="admin-credits-form" class="form-grid">
        <label>{{ t.admin_user_lookup }}
          <input id="admin-user-query" type="text" autocomplete="off" required />
        </label>
        <button type="button" id="admin-user-search-btn" class="secondary-btn">{{ t.admin_find_user }}</button>
        <div id="admin-user-preview" class="muted"></div>
        <input type="hidden" id="admin-selected-user-id" value="" />
        <label>{{ t.admin_sparks_amount }}
          <input id="admin-credits-amount" type="number" step="1" required />
        </label>
        <label>{{ t.admin_sparks_reason }}
          <input id="admin-credits-reason" type="text" value="admin_adjustment" />
        </label>
        <button type="submit" class="primary-btn">{{ t.admin_apply_credits }}</button>
      </form>
      <pre id="admin-credits-result" class="result"></pre>
    </section>

    <section class="card">
      <h2>Overview</h2>
      <div id="admin-overview" class="history-list"></div>
    </section>

    <section class="card">
      <h2>Module stats</h2>
      <div id="admin-modules" class="history-list"></div>
    </section>

    <section class="card">
      <h2>Support tickets</h2>
      <div id="admin-tickets" class="history-list"></div>
      <div id="admin-ticket-messages" class="history-list"></div>
      <pre id="admin-result" class="result"></pre>
    </section>
  </main>

  <script defer src="/static/app.js?v=e4ae1d9-admin-v1"></script>
</body>
</html>
