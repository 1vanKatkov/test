<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.numerology_report }}</title>
  <link rel="stylesheet" href="/static/style.css?v=service-theme-v1" />
</head>
<body
  class="app-shell mobile-client-shell"
  data-dev-auth-bypass="{{ 'true' if dev_auth_bypass else 'false' }}"
  data-dev-auth-mock-username="{{ dev_auth_mock_username }}"
  data-lang="{{ lang }}"
  data-report-id="{{ report_id }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client?lang={{ lang }}">{{ brand_name }}</a>
      {% include "partials/client_user_chip.html" %}
    </div>
  </header>

  <main class="mobile-client card-readings-page service-theme-page">
    <section class="card compact-card service-theme-hero">
      <h2>{{ t.numerology_report }}</h2>
      <div class="muted"><span id="auth-provider">{{ initial_auth_provider }}</span></div>
    </section>
    <section id="numerology-report-view" class="card service-theme-report"></section>
    <div id="numerology-result" class="result rich-result" hidden></div>

  </main>

  {% include "partials/client_bottom_nav.html" %}
  <script defer src="/static/app.js?v=service-theme-v1"></script>
</body>
</html>
