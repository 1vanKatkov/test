<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.verify_registration }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/style.css?v=design-unify-v2" />
</head>
<body
  class="app-shell mobile-client-shell auth-page"
  data-page="register-verify"
  data-register-email="{{ register_email }}"
  data-api-base=""
  data-lang="{{ lang }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client">{{ brand_name }}</a>
      {% include "partials/client_user_chip.html" %}
    </div>
  </header>

  <main class="mobile-client">
    <section class="card">
      <div class="page-heading-with-back">
        <a
          class="page-back-arrow"
          href="/static/auth/register.html"
          aria-label="{{ t.back }}"
          title="{{ t.back }}"
        ></a>
        <h2>{{ t.verify_registration }}</h2>
      </div>
      <p class="muted">{{ t.code_sent }}</p>
      <p class="muted"><strong id="verify-email-display">{{ register_email }}</strong></p>
      <form id="email-register-verify-form" class="form-grid" method="post" action="#">
        <input type="hidden" id="register-email" value="{{ register_email }}" />
        <label>{{ t.verification_code }} <input id="register-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" /></label>
        <button type="submit" class="primary-btn">{{ t.confirm_registration }}</button>
        <button type="button" id="register-resend-btn" class="secondary-btn">{{ t.send_code }}</button>
      </form>
      <pre id="auth-result" class="result"></pre>
    </section>
  </main>

  {% set assets_version = assets_version|default('design-unify-v2') %}
  {% include "partials/client_scripts.html" %}
</body>
</html>
