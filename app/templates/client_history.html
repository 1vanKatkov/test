<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.history }}</title>
  <link rel="stylesheet" href="/static/style.css?v=history-detail-v3" />
</head>
<body
  class="app-shell mobile-client-shell"
  data-dev-auth-bypass="{{ 'true' if dev_auth_bypass else 'false' }}"
  data-dev-auth-mock-username="{{ dev_auth_mock_username }}"
  data-lang="{{ lang }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client?lang={{ lang }}">{{ brand_name }}</a>
      {% include "partials/client_user_chip.html" %}
    </div>
  </header>

  <main class="mobile-client">
    <section class="card compact-card">
      <h2>{{ t.request_history }}</h2>
    </section>

    <section class="card">
      <div id="request-history" class="history-list"></div>
      <div id="history-result" class="result rich-result" aria-live="polite" hidden></div>
    </section>
  </main>

  {% include "partials/client_bottom_nav.html" %}
  <script defer src="/static/app.js?v=history-detail-v3"></script>
</body>
</html>
