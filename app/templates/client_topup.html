<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.topup }}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body
  class="app-shell mobile-client-shell"
  data-dev-auth-bypass="{{ 'true' if dev_auth_bypass else 'false' }}"
  data-dev-auth-mock-username="{{ dev_auth_mock_username }}"
  data-lang="{{ lang }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client?lang={{ lang }}">{{ brand_name }}</a>
      {% include "partials/client_user_chip.html" %}
    </div>
  </header>

  <main class="mobile-client">
    <section class="card compact-card">
      <h2>{{ t.topup }}</h2>
      <div class="muted"><span id="auth-provider">{{ initial_auth_provider }}</span></div>
    </section>

    <section class="card">
      <h2>{{ t.yookassa_payment }}</h2>
      <form id="payment-create-form" class="form-grid">
        <label>{{ t.spark_package }}
          <select id="payment-package" required></select>
        </label>
        <label>{{ t.receipt_email }}
          <input id="payment-email" type="email" required placeholder="name@example.com" />
        </label>
        <label class="payment-offer-consent">
          <input id="payment-offer-accepted" type="checkbox" required />
          <span>
            {{ t.public_offer_ack_prefix }}
            <a href="/public-offer.pdf" target="_blank" rel="noopener noreferrer">{{ t.public_offer_ack_link }}</a>.
          </span>
        </label>
        <button type="submit" class="primary-btn">{{ t.create_payment }}</button>
      </form>
      <pre id="payment-result" class="result"></pre>
    </section>

    <section class="card">
      <h2>{{ "Payment history" if lang == "en" else "История платежей" }}</h2>
      <div id="payments-history" class="history-list"></div>
    </section>

  </main>

  <script defer src="/static/app.js?v=5ec479e-offer-consent-v1"></script>
</body>
</html>
