<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} - {{ t.support }}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body
  class="app-shell mobile-client-shell"
  data-dev-auth-bypass="{{ 'true' if dev_auth_bypass else 'false' }}"
  data-dev-auth-mock-username="{{ dev_auth_mock_username }}"
  data-lang="{{ lang }}"
>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand" href="/client?lang={{ lang }}">{{ brand_name }}</a>
      <div class="user-chip">
        <a class="auth-username-link" href="/client/profile?lang={{ lang }}"><span id="auth-username">{{ initial_auth_username }}</span></a>
        <span class="spark-pill"><span id="header-sparks">-</span> {{ t.sparks }}</span>
      </div>
    </div>
  </header>

  <main class="mobile-client">
    <section class="card compact-card">
      <h2>{{ t.support }}</h2>
      <div class="muted"><span id="auth-provider">{{ initial_auth_provider }}</span></div>
    </section>

    <section class="card">
      <h2>{{ t.open_ticket }}</h2>
      <form id="support-ticket-form" class="form-grid">
        <label>{{ t.subject }} <input id="support-subject" required /></label>
        <label>{{ t.message }} <textarea id="support-message" rows="5" required></textarea></label>
        <button type="submit" class="primary-btn">{{ t.send }}</button>
      </form>
      <pre id="support-result" class="result"></pre>
    </section>

    <section class="card">
      <h2>{{ t.my_tickets }}</h2>
      <div id="support-tickets" class="history-list"></div>
      <div id="support-messages" class="history-list"></div>
      <form id="support-reply-form" class="form-grid">
        <label>{{ t.message }} <textarea id="support-reply-message" rows="4"></textarea></label>
        <button type="submit" class="secondary-btn">{{ t.send }}</button>
      </form>
    </section>

  </main>

  <script defer src="/static/app.js"></script>
</body>
</html>
