<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astrolhub - Подтверждение</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body
  class="app-shell mobile-client-shell auth-page auth-static-page"
  data-page="register-verify"
  data-api-base=""
  data-lang="ru"
  data-register-email=""
>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const pageLang = params.get("lang") === "en" ? "en" : "ru";
      const email = params.get("email") || "";
      document.body.dataset.lang = pageLang;
      document.body.dataset.registerEmail = email;
      document.documentElement.lang = pageLang;
      document.title = pageLang === "en" ? "Astrolhub - Confirm" : "Astrolhub - Подтверждение";
    })();
  </script>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand auth-brand-link" href="/client?lang=ru">Astrolhub</a>
      <div class="user-chip">
        <a class="auth-username-link" href="/client/profile?lang=ru"><span id="auth-username">Гость</span></a>
        <span class="spark-pill"><span id="header-sparks">-</span> <span class="auth-sparks-label">Искры</span></span>
      </div>
    </div>
  </header>

  <main class="mobile-client">
    <section class="card">
      <h2 data-auth-label="verifyTitle">Подтверждение регистрации</h2>
      <p class="muted"><strong id="verify-email-display"></strong></p>
      <form id="email-register-verify-form" class="form-grid" method="post" action="#">
        <input type="hidden" id="register-email" value="" />
        <label><span data-auth-label="verificationCode">Код из письма</span> <input id="register-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" /></label>
        <button type="submit" class="primary-btn" data-auth-label="confirmRegistration">Подтвердить</button>
        <button type="button" id="register-resend-btn" class="secondary-btn" data-auth-label="sendCode">Отправить код</button>
      </form>
      <p class="muted">
        <a class="auth-register-link" href="/static/auth/register.html?lang=ru" data-auth-label="back">Назад</a>
      </p>
      <pre id="auth-result" class="result"></pre>
    </section>
  </main>

  <script defer src="/static/app.js?v=telegram-lazy-auth-v1"></script>
</body>
</html>
