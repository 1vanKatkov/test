<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astrolhub - Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/style.css?v=design-unify-v3" />
</head>
<body
  class="app-shell mobile-client-shell auth-page auth-static-page"
  data-page="login"
  data-api-base=""
  data-lang="ru"
>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const pageLang = params.get("lang") === "en" ? "en" : "ru";
      document.body.dataset.lang = pageLang;
      document.documentElement.lang = pageLang;
      document.title = pageLang === "en" ? "Astrolhub - Login" : "Astrolhub - Вход";
    })();
  </script>
  <header class="app-topbar client-topbar">
    <div class="topbar-inner">
      <a class="brand auth-brand-link" href="/client">Astrolhub</a>
      <div class="user-chip">
        <a class="auth-username-link" href="/client/profile"><span id="auth-username">Гость</span></a>
        <span id="header-auth-links" class="header-auth-links">
          <a class="header-auth-btn auth-login-link" href="/static/auth/login.html">Вход</a>
          <a class="header-auth-btn header-auth-btn-primary auth-register-link" href="/static/auth/register.html">Регистрация</a>
        </span>
        <span class="spark-pill"><span id="header-sparks">-</span> <span class="auth-sparks-label spark-icon" aria-hidden="true">✦</span></span>
      </div>
    </div>
  </header>

  <main class="mobile-client">
    <section class="card" id="login-main-panel">
      <h2 data-auth-label="loginTitle">Вход</h2>
      <form id="email-login-form" class="form-grid" method="post" action="#">
        <label><span data-auth-label="email">Email</span> <input id="login-email" type="email" autocomplete="email" required /></label>
        <label><span data-auth-label="password">Пароль</span> <input id="login-password" type="password" autocomplete="current-password" required minlength="8" /></label>
        <button type="submit" class="primary-btn" data-auth-label="loginSubmit">Войти</button>
      </form>
      <p class="muted auth-switch-line">
        <button type="button" class="linkish-btn" id="forgot-password-open" data-auth-label="forgotPassword">Забыли пароль?</button>
      </p>
      <p class="muted auth-switch-line">
        <span data-auth-label="noAccount">Нет аккаунта?</span>
        <a class="auth-register-link" href="/static/auth/register.html" data-auth-label="goRegister">Зарегистрироваться</a>
      </p>
      <pre id="auth-result" class="result"></pre>
    </section>

    <section class="card" id="email-password-reset-panel" hidden>
      <h2 data-auth-label="forgotPasswordTitle">Восстановление пароля</h2>
      <div id="password-reset-step-start" class="form-grid" hidden></div>
      <div id="password-reset-step-code" class="form-grid">
        <p class="muted" data-auth-label="forgotPasswordHint">Укажите email — отправим код подтверждения.</p>
        <label><span data-auth-label="email">Email</span> <input id="password-reset-email" type="email" autocomplete="email" required /></label>
        <button type="button" id="password-reset-request-btn" class="primary-btn" data-auth-label="sendCode">Отправить код</button>
        <label><span data-auth-label="verificationCode">Код из письма</span> <input id="password-reset-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" /></label>
        <button type="button" id="password-reset-code-next-btn" class="primary-btn" data-auth-label="next">Далее</button>
        <button type="button" class="secondary-btn" data-password-reset-cancel data-auth-label="backToLogin">Назад ко входу</button>
      </div>
      <div id="password-reset-step-password" hidden>
        <form id="email-password-reset-form" class="form-grid">
          <label><span data-auth-label="password">Пароль</span> <input id="password-reset-new" type="password" autocomplete="new-password" minlength="8" required /></label>
          <label><span data-auth-label="repeatPassword">Повтор пароля</span> <input id="password-reset-confirm" type="password" autocomplete="new-password" minlength="8" required /></label>
          <button type="submit" class="primary-btn" data-auth-label="passwordReset">Смена пароля</button>
          <button type="button" class="secondary-btn" data-password-reset-cancel data-auth-label="backToLogin">Назад ко входу</button>
        </form>
      </div>
      <pre id="password-reset-result" class="result"></pre>
    </section>
  </main>

  <script defer src="/static/app.js?v=design-unify-v3"></script>
</body>
</html>
