<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Rocket">
  <defs>
    <linearGradient id="rocketBody" x1="16" y1="4" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd98a"/>
      <stop offset=".55" stop-color="#e8b86a"/>
      <stop offset="1" stop-color="#b875ff"/>
    </linearGradient>
    <linearGradient id="rocketFlame" x1="16" y1="22" x2="16" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#b875ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="rocketGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#rocketGlow)">
    <!-- Flame -->
    <path d="M16 24c-2.2 2.8-3.2 5.2-2.8 7.2 1.8-.8 3.4-2.4 4.6-4.6 1.2 2.2 2.8 3.8 4.6 4.6.4-2-.6-4.4-2.8-7.2" fill="url(#rocketFlame)" opacity=".75"/>
    <!-- Fins -->
    <path d="M10.5 20.5 7 24.5l4.2-1.2 2.1-4.2Z" fill="#b875ff" opacity=".72"/>
    <path d="M21.5 20.5 25 24.5l-4.2-1.2-2.1-4.2Z" fill="#b875ff" opacity=".72"/>
    <!-- Body -->
    <path d="M16 5c-3.8 0-6.5 5.8-6.5 12.5 0 2.2.6 4.2 1.6 5.8h9.8c1-1.6 1.6-3.6 1.6-5.8C22.5 10.8 19.8 5 16 5Z" fill="url(#rocketBody)"/>
    <!-- Window -->
    <circle cx="16" cy="13.5" r="2.8" fill="#1a0b34" stroke="#ffd98a" stroke-width="1" stroke-opacity=".55"/>
    <circle cx="16" cy="13.5" r="1.2" fill="#ffd98a" opacity=".65"/>
    <!-- Nose highlight -->
    <path d="M16 5.8c-1.8 1.6-3 4-3.2 6.8" stroke="#fff6d4" stroke-width=".8" stroke-linecap="round" opacity=".42"/>
  </g>
</svg>
