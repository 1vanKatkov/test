<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" fill="none" role="img" aria-label="Path to star">
  <defs>
    <radialGradient id="hillGlow" cx="50%" cy="85%" r="55%">
      <stop offset="0" stop-color="#2a1450" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1a0b34" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathGlow" x1="28" y1="108" x2="148" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b875ff"/>
      <stop offset=".45" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#fff4c8"/>
    </linearGradient>
    <radialGradient id="starBright" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset=".45" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#b875ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pathSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="90" cy="118" rx="78" ry="34" fill="url(#hillGlow)"/>

  <!-- Hill silhouette -->
  <path d="M8 118c28-42 62-58 98-52 28 5 52 22 66 52" stroke="#2a1450" stroke-width="18" stroke-linecap="round" opacity=".55"/>
  <path d="M8 118c28-42 62-58 98-52 28 5 52 22 66 52" stroke="#b875ff" stroke-width="1.2" stroke-opacity=".22" fill="none"/>

  <!-- Winding luminous path -->
  <g filter="url(#pathSoftGlow)">
    <path d="M24 112c18-18 34-28 52-34 14-5 28-4 40 2 10 5 18 14 24 26 6 12 10 24 16 32 8 11 18 16 30 14" stroke="url(#pathGlow)" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".92"/>
    <path d="M24 112c18-18 34-28 52-34 14-5 28-4 40 2 10 5 18 14 24 26 6 12 10 24 16 32 8 11 18 16 30 14" stroke="#ffd98a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity=".45"/>
  </g>

  <!-- Path waypoints -->
  <circle cx="52" cy="78" r="2.2" fill="#b875ff" opacity=".55"/>
  <circle cx="88" cy="58" r="2" fill="#ffd98a" opacity=".62"/>
  <circle cx="118" cy="72" r="1.8" fill="#b875ff" opacity=".5"/>

  <!-- Bright star at summit -->
  <g transform="translate(148 28)" filter="url(#pathSoftGlow)">
    <circle r="16" fill="url(#starBright)" opacity=".75"/>
    <path d="M0-12 2.8-2.8 12 0 2.8 2.8 0 12-2.8 2.8-12 0-2.8-2.8 0-12 2.8-2.8 12 0 2.8 2.8Z" fill="#ffd98a"/>
    <path d="M0-7 1.6-1.6 7 0 1.6 1.6 0 7-1.6 1.6-7 0-1.6-1.6 0-7 1.6-1.6 7 0 1.6 1.6Z" fill="#fff8dc" opacity=".85"/>
  </g>

  <circle cx="36" cy="98" r="1.2" fill="#ffd98a" opacity=".4"/>
  <circle cx="142" cy="96" r="1" fill="#b875ff" opacity=".35"/>
</svg>
