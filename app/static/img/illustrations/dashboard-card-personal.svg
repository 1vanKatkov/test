<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" fill="none" role="img" aria-label="Personal silhouette">
  <defs>
    <radialGradient id="personalAura" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#b875ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1a0b34" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="personalSilhouette" x1="90" y1="18" x2="90" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd98a"/>
      <stop offset=".55" stop-color="#d4a05a"/>
      <stop offset="1" stop-color="#b875ff"/>
    </linearGradient>
    <filter id="personalGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="90" cy="72" rx="72" ry="62" fill="url(#personalAura)"/>

  <g filter="url(#personalGlow)" opacity=".92">
    <!-- Feminine silhouette -->
    <path d="M90 24c-10 0-18 8-18 18 0 7 4 13 10 16-8 3-14 11-14 21v8c0 2 1 4 3 4h38c2 0 3-2 3-4v-8c0-10-6-18-14-21 6-3 10-9 10-16 0-10-8-18-18-18Z" fill="url(#personalSilhouette)" opacity=".88"/>
    <path d="M90 24c-10 0-18 8-18 18 0 7 4 13 10 16-8 3-14 11-14 21v8c0 2 1 4 3 4h38c2 0 3-2 3-4v-8c0-10-6-18-14-21 6-3 10-9 10-16 0-10-8-18-18-18Z" stroke="#ffd98a" stroke-width="1.2" stroke-opacity=".35" fill="none"/>
    <!-- Flowing hair arc -->
    <path d="M72 38c-8 6-12 16-10 28 2 10 8 18 16 22" stroke="#b875ff" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
    <path d="M108 38c8 6 12 16 10 28-2 10-8 18-16 22" stroke="#ffd98a" stroke-width="1.8" stroke-linecap="round" opacity=".42"/>
  </g>

  <circle cx="62" cy="52" r="1.4" fill="#ffd98a" opacity=".6"/>
  <circle cx="118" cy="48" r="1.2" fill="#b875ff" opacity=".55"/>
  <circle cx="132" cy="88" r="1" fill="#ffd98a" opacity=".45"/>
</svg>
